name: Go Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 #Need full history for gitleaks

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Security: Scanning for Secrets in Code (i.e. API-Keys, Passwörter)
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: go mod download
      - name: Verify Build
        run: make build

      # SRE-Best-Practice: Tests and Code-Analysis before Deployment
      - name: Run Tests
        run: make test

      - name: Run Vet
        run: go vet ./...