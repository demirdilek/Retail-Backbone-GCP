name: Retail Edge Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: retail-backbone-gcp
  REGION: europe-west3
  REPOSITORY: retail-edge-repo
  # English comment: The sub-folder/image name in your GAR repo
  IMAGE: retail-edge-service

permissions:
  contents: 'read'
  id-token: 'write'
  
jobs:
  deploy:
    name: Build and Push Multi-Arch Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # English comment: Set up QEMU for ARM64 emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # English comment: OIDC Authentication with fixed Provider and SA names
      - name: Google Auth (OIDC)
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          # English comment: Using the v2 provider created via Terraform
          workload_identity_provider: 'projects/962774029483/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2'
          service_account: 'github-actions-sa@retail-backbone-gcp.iam.gserviceaccount.com'
          token_format: 'access_token'

      # English comment: Professional Docker Login using the access token from the auth step
      - name: Docker Login
        uses: 'docker/login-action@v3'
        with:
          registry: '${{ env.REGION }}-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Build and Push Multi-Arch
        uses: 'docker/build-push-action@v5'
        with:
          context: .
          push: true
          # English comment: Building for both Cloud (amd64) and Edge (arm64)
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          # English comment: Enables GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max