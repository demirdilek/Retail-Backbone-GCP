name: "Retail Edge Deployment"

on:
  push:
    branches: [ "main" ]

# Minimum permissions required for Workload Identity Federation (WIF)
permissions:
  id-token: write 
  contents: read

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud using OIDC (Zero Trust)
      - id: auth
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: 'retail-backbone-gcp'
          workload_identity_provider: 'projects/962774029483/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'retail-backbone-sa@retail-backbone-gcp.iam.gserviceaccount.com'

      # 2. Go Build & Test: Ensure 4 Golden Signals tracking remains stable
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go.sum
      
      - name: Run Unit Tests
        run: go test -v ./...
        
      - name: Build Go Application
        run: go build -v -o retail-edge-binary ./cmd/server

      # 3. Terraform: Infrastructure as Code (Eliminating Toil)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init & Apply
        working-directory: ./infra/terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="project_id=retail-backbone-gcp"

      # 4. Containerization: Package for GKE / Retail Edge Node
      - name: Configure Docker for Artifact Registry
        run: |
          # This tells Docker to use gcloud as a credential helper for your specific region
          gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet        
     
      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="europe-west3-docker.pkg.dev/retail-backbone-gcp/retail-repo/retail-edge-node:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
      # 5. Infrastructure and Deployment (SRE Best Practices)
      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'retail-edge-cluster'
          location: 'europe-west3-b'

      - name: Deploy to GKE
        run: |
          # Apply the basic Kubernetes manifests (Deployment & Service)
          kubectl apply -f k8s/deployment.yaml
          
          # Update the deployment to use the specific container image version from this commit
          kubectl set image deployment/retail-edge-node \
            retail-edge-node=europe-west3-docker.pkg.dev/retail-backbone-gcp/retail-repo/retail-edge-node:${{ github.sha }}
          
          # Wait for the rollout to finish to ensure the new version is healthy
          kubectl rollout status deployment/retail-edge-node

      # 5. Deployment Notification or Kubernetes Update (Placeholders)
      - name: Deployment Success Summary
        run: echo "Retail Edge Backbone successfully deployed with version ${{ github.sha }}"