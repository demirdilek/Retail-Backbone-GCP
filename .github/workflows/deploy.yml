name: Retail Edge Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: retail-backbone-gcp
  REGION: europe-west3
  REPOSITORY: retail-edge-repo
  IMAGE: retail-edge-service
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: 'read'
  id-token: 'write'
  
jobs:
  deploy:
    name: Build and Push Multi-Arch Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup for Multi-Platform Builds (AMD64 & ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Google Auth (OIDC)
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/962774029483/locations/global/workloadIdentityPools/github-pool/providers/github-provider-final'
          service_account: 'github-action-sa@retail-backbone-gcp.iam.gserviceaccount.com'
          project_id: 'retail-backbone-gcp'
          token_format: 'access_token'

      - name: Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          REPO_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          
          # Build for Cloud (amd64) and Edge-Hardware (arm64)
          # Use Docker-Caching for faster builds
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t $REPO_PATH:${{ github.sha }} \
            -t $REPO_PATH:latest .