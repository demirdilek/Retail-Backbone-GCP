# k8s/gateway.yaml
# Optimized for Traefik (k3s default) and Gateway API v1.0
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: retail-gateway
  namespace: default
spec:
  # Traefik in k3s identifies itself via the 'traefik' class
  gatewayClassName: traefik 
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All