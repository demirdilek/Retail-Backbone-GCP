apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-edge-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retail-edge
  template:
    metadata:
      labels:
        app: retail-edge
    spec:
      imagePullSecrets:
        - name: gcp-registry-key
      containers:
        - name: edge-service
          image: europe-west3-docker.pkg.dev/retail-backbone-gcp/retail-edge-repo/retail-edge-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # --- Add this block to fix the warning ---
          resources:
            limits:
              cpu: "500m"     # Max 0.5 CPU core
              memory: "256Mi" # Max 256MB RAM
            requests:
              cpu: "100m"     # Guaranteed 0.1 CPU core
              memory: "128Mi" # Guaranteed 128MB RAM