# ==============================================================================
# Retail Edge - Local Recruiter Demo Environment (HTTPS + SRE Stack)
# ==============================================================================

services:
  # PostgreSQL Database for Edge Sales Data
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: retail_edge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_edge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Main Retail Edge Application
  retail-edge-server:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8443:443"  # Maps HTTPS to 8443 on your local machine
      - "8080:8080" # Maps HTTP fallback
    environment:
      # Database and Edge logic
      - DB_DSN=postgres://retail_user:retail_password@db:5432/retail_edge?sslmode=disable
      - GCP_BACKBONE_URL=
      - EDGE_NODE_ID=local-demo-node
      # TLS Configuration
      - CERT_PATH=/root/certs/cert.crt
      - KEY_PATH=/root/certs/cert.key
    volumes:
      - ./certs:/root/certs:ro
      - ./web:/root/web:ro
      - ./retail-edge-lab/inventory.json:/root/inventory.json:ro
    depends_on:
      db:
        condition: service_healthy

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true # Enable anonymous access for simplicity
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  pgdata:
  prometheus_data:
  grafanadata: